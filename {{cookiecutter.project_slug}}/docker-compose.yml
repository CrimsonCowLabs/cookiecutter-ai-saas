services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Required: without it Docker builds the last stage in the Dockerfile
      # (migrator), and the app container migrates, exits and restart-loops.
      target: runner
    ports:
      - "3000:3000"
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile.worker
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  db-writer:
    build:
      context: .
      dockerfile: workers/db-writer/Dockerfile.writer
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
{% if cookiecutter.database_extensions == 'pgvector' %}
    image: pgvector/pgvector:pg18
{% else %}
    image: postgres:18-alpine
{% endif %}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{ cookiecutter.project_slug | replace('-', '_') }}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # refuse to start against a volume mounted at .../data. Mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      - "{{ cookiecutter.postgres_port }}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "{{ cookiecutter.redis_port }}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
