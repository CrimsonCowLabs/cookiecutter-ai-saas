services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Required: without it Docker builds the last stage in the Dockerfile
      # (migrator), and the app container migrates, exits and restart-loops.
      target: runner
    ports:
      - "3000:3000"
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Next.js standalone serves plain HTTP; wget ships in node:*-alpine
      # already, so no extra tooling has to be installed into the image just to
      # probe it. 127.0.0.1, not localhost: this image resolves "localhost" to
      # ::1 first, and the server listens on 0.0.0.0 (IPv4 only) — wget would
      # otherwise fail every probe with an immediate connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile.worker
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      # No HTTP surface to probe, so worker.py touches /tmp/healthy every 5s —
      # but only while it can actually reach Redis, so a lost Redis connection
      # reports unhealthy rather than just "the process is still running".
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p = pathlib.Path('/tmp/healthy'); sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 15 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  db-writer:
    build:
      context: .
      dockerfile: workers/db-writer/Dockerfile.writer
    env_file: .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Same heartbeat-file idea as worker's: no HTTP surface, and the file is
      # only touched while worker.mjs's Redis connection is actually alive.
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const s=fs.statSync('/tmp/healthy');process.exit(Date.now()-s.mtimeMs<15000?0:1)}catch(e){process.exit(1)}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
{% if cookiecutter.database_extensions == 'pgvector' %}
    image: pgvector/pgvector:pg18
{% else %}
    image: postgres:18-alpine
{% endif %}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{ cookiecutter.project_slug | replace('-', '_') }}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # refuse to start against a volume mounted at .../data. Mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      - "{{ cookiecutter.postgres_port }}:5432"
    healthcheck:
      # Over TCP, for the reason docker-compose.prod.yml spells out: a socket
      # probe answers while a new data directory is still being initialised,
      # which lets everything waiting on this start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "{{ cookiecutter.redis_port }}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
