services:
  app:
    image: {{ cookiecutter.project_slug }}-app:latest
    ports:
      - "3000:3000"
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .env-production:/app/.env:ro
    networks:
      - caddy-net
      - default

  worker:
    image: {{ cookiecutter.project_slug }}-worker:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .env-production:/app/.env:ro
    deploy:
      replicas: 1

  db-writer:
    image: {{ cookiecutter.project_slug }}-db-writer:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .env-production:/app/.env:ro
    restart: unless-stopped

  ops:
    image: {{ cookiecutter.project_slug }}-ops:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - .env-production:/app/.env:ro

  postgres:
{% if cookiecutter.database_extensions == 'pgvector' %}
    image: pgvector/pgvector:pg18
{% else %}
    image: postgres:18-alpine
{% endif %}
    environment:
      POSTGRES_USER: {% raw %}${POSTGRES_USER:-postgres}{% endraw %}
      POSTGRES_PASSWORD: {% raw %}${POSTGRES_PASSWORD}{% endraw %}
      POSTGRES_DB: {{ cookiecutter.project_slug | replace('-', '_') }}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # refuse to start against a volume mounted at .../data. Mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
    caddy-net:
      external: true
