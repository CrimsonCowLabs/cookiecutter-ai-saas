services:
  caddy:
    image: caddy:2-alpine
    # The front door: Caddy terminates TLS, redirects HTTP to HTTPS and proxies
    # to `app`, so bringing this stack up is all that serving the site over
    # HTTPS takes.
    #
    # On the host's network rather than behind published ports, so it binds
    # 80/tcp, 443/tcp and 443/udp (HTTP/3) on the host itself. The host's
    # firewall is ufw alone — Docker writes no iptables rules there (see
    # ansible/provision.yml) — so a published port would be relayed by
    # docker-proxy, and every client would reach Caddy from the same Docker
    # gateway address. That would put the whole internet in one bucket for the
    # contact form's per-IP rate limit, and make any IP ban useless. Here Caddy
    # sees each client's own address and passes it on in X-Forwarded-For.
    #
    # The cost is isolation. Caddy used to sit on a network of its own with the
    # app, which Postgres and Redis never joined, so a compromised proxy had no
    # route to the database. On the host's network it has the host's routes,
    # and the host can reach every container's address directly: Postgres
    # (which still wants its password) and Redis (which has none) are a
    # connection away. What keeps them from the internet is unchanged — they
    # publish no port, and nothing from outside is forwarded to a container —
    # but what keeps them from Caddy is now only Caddy not being compromised.
    network_mode: host
    environment:
      # Pass-through with no default: unset means the Caddyfile's own default,
      # https://{{ cookiecutter.domain_name }}. Set it to https://localhost to
      # smoke-test the stack on a box with no DNS for that name.
      - SITE_ADDRESS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this volume means
      # re-issuing on the next boot, and Let's Encrypt rate-limits that.
      - caddydata:/data
      - caddyconfig:/config
      # The JSON access log (see the Caddyfile's `log` block), on the host at
      # logs/caddy/access.log beside this file, where a ban jail can read it.
      # A bind mount rather than a volume so that the path is a plain file the
      # host's own tools see. Caddy rotates and bounds it itself; it is not
      # shipped to `docker compose logs`.
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: {{ cookiecutter.project_slug }}-app:latest
    # Published on the host's loopback only, which is where Caddy (on the
    # host's network) reaches it. Nothing outside the host can: loopback is not
    # routable, and ufw would refuse port 3000 anyway. Keep the 127.0.0.1 —
    # without it the port is bound on every address, and only the firewall
    # would stand between the app and the internet, without TLS.
    ports:
      - "127.0.0.1:3000:3000"
    # env_file and nothing else: compose reads the file itself, as the deploy
    # account, and injects the values as environment variables. Mounting it
    # into the container as well would need it readable by the container's own
    # uid, and ansible/deploy.yml writes it 0600 to the deploy account. Nothing
    # in the app reads a file — every setting is read from the environment.
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: {{ cookiecutter.project_slug }}-worker:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  db-writer:
    image: {{ cookiecutter.project_slug }}-db-writer:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ops:
    image: {{ cookiecutter.project_slug }}-ops:latest
    env_file: .env-production
    depends_on:
      postgres:
        condition: service_healthy
    # Not a service: it exits as soon as it starts, and exists so that
    # `docker compose run ops ...` has an image with the dev dependencies in
    # it. `restart: unless-stopped` is what deploy.yml's health gate reads as
    # "meant to stay up", so this must not have it.
    restart: "no"
    # And a profile, so `up` leaves it alone entirely. Without one, every `up`
    # starts a container that immediately exits — which makes a deploy of
    # unchanged code report a change forever, and makes "did anything change?"
    # useless as a signal. `docker compose run ops ...` enables the profile by
    # naming the service, so nothing about using it changes.
    profiles: ["tools"]

  postgres:
{% if cookiecutter.database_extensions == 'pgvector' %}
    image: pgvector/pgvector:pg18
{% else %}
    image: postgres:18-alpine
{% endif %}
    environment:
      POSTGRES_USER: {% raw %}${POSTGRES_USER:-postgres}{% endraw %}
      POSTGRES_PASSWORD: {% raw %}${POSTGRES_PASSWORD}{% endraw %}
      POSTGRES_DB: {{ cookiecutter.project_slug | replace('-', '_') }}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # refuse to start against a volume mounted at .../data. Mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP (-h), not the local socket. While Postgres initialises a new
      # data directory it runs a temporary server on the socket only, so a
      # socket probe reports "healthy" several seconds before anything outside
      # the container can connect. Everything that waits on this — the app, the
      # worker, and the migrations ansible/deploy.yml runs before switching
      # over — would otherwise be let through too early on a first deploy, and
      # drizzle-kit in particular exits 1 with no message at all when it cannot
      # reach the database.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
