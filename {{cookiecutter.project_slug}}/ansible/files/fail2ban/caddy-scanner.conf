# Managed by ansible/provision.yml. Edits here are overwritten.
#
# Matches a request Caddy refused as a scanner probe: the Caddyfile's @scanner
# block appends `"blocked":"scanner"` to that request's access-log line, and
# nothing else writes it. One probe is already more than a person browsing the
# site ever sends, so the jail (jail.d/caddy.local) bans after very few.
#
# Read against the JSON access log Caddy writes, one object per line:
#
#   {"level":"info","ts":1760000000.1234567,"logger":"http.log.access.log0",
#    "msg":"handled request","request":{"remote_ip":"198.51.100.7",...,
#    "uri":"/.env","headers":{...}},...,"status":404,"resp_headers":{...},
#    "blocked":"scanner"}
#
# Why this cannot be forged. Everything a client controls — the URI, every
# header — is a JSON string in that line, and JSON escapes a quote inside a
# string as \". So the bare sequence `,"blocked":"scanner"` can only be Caddy's
# own field, and the first `"request":{"remote_ip":"` can only be Caddy's own
# record of the TCP peer: it comes before any client-controlled field, and the
# match is anchored to the start of the line. A client that writes either into
# a header is counted, if at all, under its own address
# (scripts/check_ban_filters.sh sends exactly that).
#
# remote_ip and not client_ip: client_ip is what X-Forwarded-For claims once a
# proxy is trusted, and nothing in front of Caddy is. Caddy runs on the host's
# network, so remote_ip is the client's own address (docker-compose.prod.yml).

[Definition]

failregex = ^"logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"<ADDR>",.*,"blocked":"scanner"[,}]

ignoreregex =

# `ts` is seconds since the epoch as a float with as many as nine decimals.
# fail2ban's {EPOCH} reads at most six of them, so the rest — and the comma —
# are swallowed too, leaving the line to start at "logger" for the anchor
# above. fail2ban cuts the whole date match out before applying failregex.
# Anchored to the start, so a number in a URI is never mistaken for the time.
datepattern = ^\{"level":"[a-z]+","ts":{EPOCH}[.\d]*,
