# Managed by ansible/provision.yml. Edits here are overwritten.
#
# Matches any request answered with a 4xx: the app's 404s, 401s and 403s, its
# 429s when a rate limit trips, and Caddy's own 413 for an oversized body. A
# person makes a few of these by accident; a bot guessing URLs or hammering a
# form makes hundreds, so the jail (jail.d/caddy.local) only bans well past
# anything browsing produces.
#
# Two kinds of request are never counted, because a legitimate client's
# failures pile up there through no fault of its own:
#
#   /api/webhook/stripe   Stripe retries a delivery the app refused (a bad
#                         signature after a secret rotation, say) for days,
#                         from a handful of addresses. Banning them would stop
#                         billing events arriving at all.
#   /api/auth/callback/   A sign-in a provider bounced back as failed —
#                         an expired state cookie, a cancelled consent screen
#                         — is the user's own browser, retrying.
#
# The webhook is matched as its exact path (a query string allowed), the
# callbacks as a prefix, since each provider has its own. A client can
# dodge the count by sending its junk there instead, but it can only ever make
# itself *less* likely to be banned that way, never somebody else more.
#
# The line, and why its fields cannot be forged, is described in
# caddy-scanner.conf. Here the URI is reached by stepping over the request's
# string fields one by one — each `"key":"value",` with escapes honoured — so
# the `"uri"` matched is Caddy's own and never one written into a header
# further along. The status is the top-level one, which only Caddy writes and
# which is always followed by resp_headers.

[Definition]

failregex = ^"logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"<ADDR>",(?:"[a-z_]+":"(?:[^"\\]|\\.)*",)*"uri":"(?!/api/webhook/stripe[?"]|/api/auth/callback/).*,"status":4\d\d,"resp_headers":

ignoreregex =

# As in caddy-scanner.conf: the float epoch in `ts`, cut out whole.
datepattern = ^\{"level":"[a-z]+","ts":{EPOCH}[.\d]*,
