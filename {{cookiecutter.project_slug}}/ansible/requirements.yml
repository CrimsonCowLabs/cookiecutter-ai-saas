---
# The two collections provision.yml uses beyond ansible.builtin.
#
# The `ansible` distribution (pipx install ansible) already bundles both, so
# this file matters only if you installed bare ansible-core:
#
#     ansible-galaxy collection install -r ansible/requirements.yml
collections:
  # community.general.ufw — the firewall rules, idempotently. Driving `ufw`
  # through the command module instead would report a change on every run.
  - name: community.general
  # ansible.posix.authorized_key — adds the deploy key without replacing keys
  # somebody added by hand.
  - name: ansible.posix

# ansible/backup.yml adds nothing to this list. Scheduled dumps, their systemd
# units and the vault are all ansible.builtin, and the one thing that is not a
# module — rclone talking to the destination — is a command by design, because
# its own config file is the interface every rclone backend shares.
