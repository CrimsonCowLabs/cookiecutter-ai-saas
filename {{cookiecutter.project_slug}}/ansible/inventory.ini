# The host ansible/provision.yml provisions and ansible/deploy.yml ships to.
#
# Replace YOUR_VPS_IP with the server's address. It is the only place the
# address appears — both playbooks read it from here:
#
#     ansible-playbook -i ansible/inventory.ini ansible/provision.yml
#     ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --ask-vault-pass
#
# The host is named for the domain and reached by address, so this works before
# DNS points anywhere. Keep the address even after the record resolves:
# deploy.yml's DNS pre-flight is the comparison between the two, and dropping
# ansible_host leaves it with nothing to compare — which it will say, and skip.

[vps]
__DOMAIN_NAME__ ansible_host=YOUR_VPS_IP

[vps:vars]
# Trust the host key the first time and pin it after that. A changed key still
# stops the run, which is the part worth keeping; `no` would throw that away.
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new

# Uncomment if sshd answers somewhere other than 22. The firewall follows this
# value, so the two cannot disagree.
# ansible_port=2222

# Uncomment if the key for this host is not the one ssh would pick by default.
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
