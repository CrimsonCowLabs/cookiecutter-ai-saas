name: Nightly stack health check

on:
  schedule:
    # 04:37 UTC — off the top of the hour, away from the rush of jobs every
    # other repo schedules on the hour or half-hour.
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Generates a project, brings the full stack up for real (app, worker,
  # db-writer, postgres, redis — all five now carry Docker healthchecks, see
  # docker-compose.yml), waits for every one of them to report healthy, and
  # runs one job through the queue and worker end to end. See
  # scripts/check_stack_health.sh for the check itself.
  stack-health:
    name: Full stack comes up healthy and runs a real job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Matches "python_version" in cookiecutter.json.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-stack project_name="Stack Health App"

      - name: Bring up the full stack and run a job through it
        run: scripts/check_stack_health.sh .generated-stack/stack-health-app

  # A nightly failure has to actually be seen: file (or comment on) a GitHub
  # issue so it shows up wherever the maintainer already looks, rather than
  # only in an Actions run nobody happens to open. Repeated failures comment
  # on the same open issue instead of filing a new one each night.
  report-failure:
    name: Report a nightly failure
    needs: stack-health
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The nightly stack health check failed: ${runUrl}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-failure",
            });

            if (existing.length > 0) {
              const issue = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Nightly stack health check is failing",
                body,
                labels: ["nightly-failure"],
              });
            }
