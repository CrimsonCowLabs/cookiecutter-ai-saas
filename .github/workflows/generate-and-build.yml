name: Generate and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Matches "python_version" in cookiecutter.json.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cookiecutter
        run: python -m pip install cookiecutter

      - name: Generate project from default answers
        run: cookiecutter . --no-input -o .generated

      # Lockfiles ship with the template and are copied verbatim, so every generation
      # gets the same dependency tree. Only the project name inside the npm locks is
      # substituted; poetry.lock is untouched.
      - name: Verify lockfiles match the template
        run: |
          T='{{cookiecutter.project_slug}}'
          G=.generated/my-ai-app
          cmp "$T/workers/app/poetry.lock" "$G/workers/app/poetry.lock"
          sed 's/__PROJECT_SLUG__/my-ai-app/g' "$T/package-lock.json" | cmp - "$G/package-lock.json"
          sed 's/__PROJECT_SLUG__/my-ai-app/g' "$T/workers/db-writer/package-lock.json" | cmp - "$G/workers/db-writer/package-lock.json"

      - name: Install dependencies (frozen)
        working-directory: .generated/my-ai-app
        run: npm ci --no-audit --no-fund

      - name: Install db-writer dependencies (frozen)
        working-directory: .generated/my-ai-app/workers/db-writer
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check poetry.lock is in sync with pyproject.toml
        working-directory: .generated/my-ai-app/workers/app
        run: |
          python -m pip install "poetry>=2.5,<3"
          poetry check --lock

      - name: Typecheck
        working-directory: .generated/my-ai-app
        run: npm run typecheck

      - name: Build
        working-directory: .generated/my-ai-app
        run: npm run build

      - name: Compile-check Python workers
        working-directory: .generated/my-ai-app
        run: python -m compileall -q workers/app

      # Changing python_version invalidates poetry.lock; the hook must drop it
      # instead of shipping a stale one.
      - name: Generate with non-default python_version
        run: |
          cookiecutter . --no-input -o .generated-alt project_name="Alt App" python_version=3.13
          test ! -e ".generated-alt/alt-app/workers/app/poetry.lock"
          grep -q 'python = ">=3.13,<4"' .generated-alt/alt-app/workers/app/pyproject.toml

      # Each merged/optional choice must generate a buildable project when flipped.
      - name: Generate with marketing extras off and pgvector on
        run: |
          cookiecutter . --no-input -o .generated-lean project_name="Lean App" include_marketing_extras=no database_extensions=pgvector
          G=.generated-lean/lean-app
          test ! -e "$G/app/(main)/blog" && test ! -e "$G/app/(main)/contact" && test ! -e "$G/app/api/contact"
          grep -q 'pgvector/pgvector:pg18' "$G/docker-compose.yml" "$G/docker-compose.prod.yml"

      - name: Build with marketing extras off
        working-directory: .generated-lean/lean-app
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build

      # llm_provider=openrouter must generate a buildable project whose worker
      # tests (fake OpenAI-compatible server, no real key) pass.
      - name: Generate with OpenRouter provider
        run: |
          cookiecutter . --no-input -o .generated-openrouter project_name="Router App" llm_provider=openrouter
          G=.generated-openrouter/router-app
          grep -q '^LLM_PROVIDER=openrouter' "$G/.env.example"
          grep -q '^OPENROUTER_API_KEY=' "$G/.env.example"

      - name: Build and test worker with OpenRouter provider
        working-directory: .generated-openrouter/router-app
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
          python -m pip install "poetry>=2.5,<3"
          cd workers/app
          poetry install --no-root
          poetry run pytest -q

      # Magic link is independent of the OAuth choice: turning it off must drop
      # its files, provider, UI and env vars, and the result must still build.
      - name: Generate with magic link off
        run: |
          cookiecutter . --no-input -o .generated-nolink project_name="No Link App" auth_providers=google_only include_magic_link=no include_marketing_extras=no
          G=.generated-nolink/no-link-app
          test ! -e "$G/app/(main)/(auth)/magic-link" && test ! -e "$G/components/auth/magic-link-form.tsx"
          ! grep -rE 'MagicLink|/magic-link|Resend|RESEND' "$G/lib" "$G/app" "$G/components" "$G/middleware.ts" "$G/.env.example"
          grep -q '^GOOGLE_ID=' "$G/.env.example"
          ! grep -q 'MICROSOFT' "$G/.env.example"

      - name: Build with magic link off
        working-directory: .generated-nolink/no-link-app
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
