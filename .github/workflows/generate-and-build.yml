name: Generate and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fails if cookiecutter.json gains a choice value the matrix below never exercises.
  matrix-coverage:
    name: Matrix covers every choice value
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pyyaml
      - run: python scripts/check_ci_matrix.py

  # The hook's own logic that needs no generation, chiefly pruning
  # package-lock.json when analytics=none drops posthog-js.
  hook-tests:
    name: Post-generation hook unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s hooks/tests -v

  # Roughly pairwise selection: every value of every choice appears in at least
  # one combination (enforced by matrix-coverage). Each entry is named so a
  # failing check identifies the combination. Keep keys equal to cookiecutter.json.
  flag-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "default: none / stripe / extras / google+microsoft / link / ollama / no-analytics"
            database_extensions: none
            include_stripe: "yes"
            include_marketing_extras: "yes"
            auth_providers: google_microsoft
            include_magic_link: "yes"
            llm_provider: ollama
            analytics: none
          - name: "pgvector / no-stripe / no-extras / google-only / no-link / openai / no-analytics"
            database_extensions: pgvector
            include_stripe: "no"
            include_marketing_extras: "no"
            auth_providers: google_only
            include_magic_link: "no"
            llm_provider: openai
            analytics: none
          - name: "none / no-stripe / extras / microsoft-only / link / anthropic / posthog"
            database_extensions: none
            include_stripe: "no"
            include_marketing_extras: "yes"
            auth_providers: microsoft_only
            include_magic_link: "yes"
            llm_provider: anthropic
            analytics: posthog
          - name: "pgvector / stripe / no-extras / microsoft-only / no-link / openrouter / no-analytics"
            database_extensions: pgvector
            include_stripe: "yes"
            include_marketing_extras: "no"
            auth_providers: microsoft_only
            include_magic_link: "no"
            llm_provider: openrouter
            analytics: none
          - name: "none / stripe / no-extras / google+microsoft / no-link / anthropic / no-analytics"
            database_extensions: none
            include_stripe: "yes"
            include_marketing_extras: "no"
            auth_providers: google_microsoft
            include_magic_link: "no"
            llm_provider: anthropic
            analytics: none
          - name: "pgvector / no-stripe / extras / google+microsoft / link / openai / posthog"
            database_extensions: pgvector
            include_stripe: "no"
            include_marketing_extras: "yes"
            auth_providers: google_microsoft
            include_magic_link: "yes"
            llm_provider: openai
            analytics: posthog
          - name: "none / no-stripe / no-extras / google-only / link / openrouter / posthog"
            database_extensions: none
            include_stripe: "no"
            include_marketing_extras: "no"
            auth_providers: google_only
            include_magic_link: "yes"
            llm_provider: openrouter
            analytics: posthog
          - name: "pgvector / stripe / extras / microsoft-only / no-link / ollama / posthog"
            database_extensions: pgvector
            include_stripe: "yes"
            include_marketing_extras: "yes"
            auth_providers: microsoft_only
            include_magic_link: "no"
            llm_provider: ollama
            analytics: posthog
    env:
      G: .generated/matrix-app
    steps:
      - uses: actions/checkout@v4

      # Matches "python_version" in cookiecutter.json.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cookiecutter
        run: python -m pip install cookiecutter

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated project_name="Matrix App" \
            database_extensions=${{ matrix.database_extensions }} \
            include_stripe=${{ matrix.include_stripe }} \
            include_marketing_extras=${{ matrix.include_marketing_extras }} \
            auth_providers=${{ matrix.auth_providers }} \
            include_magic_link=${{ matrix.include_magic_link }} \
            llm_provider=${{ matrix.llm_provider }} \
            analytics=${{ matrix.analytics }}

      # Lockfiles ship with the template and are copied verbatim, so every generation
      # gets the same dependency tree. Only the project name inside the npm locks is
      # substituted; poetry.lock is untouched.
      #
      # The one exception is analytics=none: the template's lock includes
      # posthog-js, and the hook prunes it and everything only it needed. That
      # pruned lock is held to what npm itself writes for the same removal —
      # `npm uninstall --package-lock-only` on a copy of the template, which
      # reads only the lockfile (offline, no scripts) — so the hook cannot
      # drift from npm's own idea of the tree. `npm ci` below then refuses any
      # package.json/lock disagreement.
      - name: Verify lockfiles match the template
        run: |
          T='{{cookiecutter.project_slug}}'
          cmp "$T/workers/app/poetry.lock" "$G/workers/app/poetry.lock"
          if [ "${{ matrix.analytics }}" = none ]; then
            E="$RUNNER_TEMP/expected-lock"
            mkdir -p "$E" && cp "$T/package.json" "$T/package-lock.json" "$E/"
            (cd "$E" && npm uninstall posthog-js --package-lock-only --offline --ignore-scripts --no-audit --no-fund)
            sed 's/__PROJECT_SLUG__/matrix-app/g' "$E/package-lock.json" | cmp - "$G/package-lock.json"
          else
            sed 's/__PROJECT_SLUG__/matrix-app/g' "$T/package-lock.json" | cmp - "$G/package-lock.json"
          fi
          sed 's/__PROJECT_SLUG__/matrix-app/g' "$T/workers/db-writer/package-lock.json" | cmp - "$G/workers/db-writer/package-lock.json"

      # Each flag value must leave (or remove) exactly what it promises.
      - name: Assert flag effects
        run: |
          # Without Stripe there are no subscriptions, so no renewal terms,
          # no subscriptions page and no claim about either anywhere.
          if [ "${{ matrix.include_stripe }}" = no ]; then
            test ! -e "$G/lib/renewal-terms.ts" && test ! -e "$G/components/billing"
            test ! -e "$G/app/(main)/legal/subscriptions" && test ! -e "$G/tests/compliance/renewal-terms.test.mjs"
            test ! -e "$G/lib/subscription-acknowledgment.ts" && test ! -e "$G/tests/compliance/subscription-acknowledgment.test.mjs"
            ! grep -rqiE 'renew|subscription|STRIPE_API_BASE|RESEND_BASE_URL' "$G/app" "$G/components" "$G/lib/legal-topics.ts" "$G/scripts/check_compliance.sh" "$G/docs/compliance.md"
          else
            test -e "$G/lib/renewal-terms.ts" && test -e "$G/app/(main)/legal/subscriptions/page.tsx"
            # New subscribers are acknowledged by email, so Resend's key ships
            # whatever the magic-link and marketing-extras answers.
            test -e "$G/lib/subscription-acknowledgment.ts" && grep -q '^RESEND_API_KEY=' "$G/.env.example"
          fi
          # Marketing email and unsubscribing ship whenever anything sends
          # email (magic link, the contact form or Stripe), and not otherwise.
          if [ "${{ matrix.include_magic_link }}" = no ] && [ "${{ matrix.include_marketing_extras }}" = no ] && [ "${{ matrix.include_stripe }}" = no ]; then
            test ! -e "$G/lib/marketing-email.ts" && test ! -e "$G/lib/unsubscribe.ts"
            test ! -e "$G/app/(main)/unsubscribe" && test ! -e "$G/app/api/unsubscribe"
            test ! -e "$G/tests/compliance/unsubscribe.test.mjs" && test ! -e "$G/tests/compliance/marketing-email.test.mjs"
            test ! -e "$G/tests/compliance/fake-resend.mjs" && test ! -e "$G/app/(main)/legal/email-preferences"
            ! grep -rqiE 'email-preferences|sendMarketingEmail' "$G/lib/legal-topics.ts" "$G/app/(main)/privacy-policy" "$G/tests/compliance/legal-pages.test.mjs" "$G/AGENTS.md" "$G/README.md" "$G/docs/compliance.md"
            ! grep -rqiE 'email_suppressions|unsubscribe' "$G/lib/db/schema.ts" "$G/middleware.ts" "$G/tests/compliance/support.mjs" "$G/tests/compliance/accessibility.test.mjs" "$G/tests/compliance/third-party-requests.test.mjs" "$G/scripts/check_compliance.sh"
          else
            test -e "$G/lib/marketing-email.ts" && test -e "$G/app/(main)/unsubscribe/page.tsx" && test -e "$G/app/api/unsubscribe/route.ts"
            test -e "$G/tests/compliance/unsubscribe.test.mjs" && test -e "$G/tests/compliance/fake-resend.mjs"
            test -e "$G/app/(main)/legal/email-preferences/page.tsx" && grep -q 'sendMarketingEmail' "$G/AGENTS.md" "$G/docs/compliance.md"
            grep -q 'email_suppressions' "$G/lib/db/schema.ts" && grep -q '^FAKE_RESEND_PORT=3997$' "$G/scripts/check_compliance.sh"
          fi
          if [ "${{ matrix.include_marketing_extras }}" = no ]; then
            test ! -e "$G/app/(main)/blog" && test ! -e "$G/app/(main)/contact" && test ! -e "$G/app/api/contact"
          else
            test -e "$G/app/(main)/blog" && test -e "$G/app/api/contact"
          fi
          if [ "${{ matrix.database_extensions }}" = pgvector ]; then
            grep -q 'pgvector/pgvector:pg18' "$G/docker-compose.yml" "$G/docker-compose.prod.yml"
          else
            ! grep -q 'pgvector/pgvector' "$G/docker-compose.yml" "$G/docker-compose.prod.yml"
          fi
          # The proxy config is flag-independent, so every combination must
          # still produce a Caddyfile naming the default domain.
          grep -qF '{$SITE_ADDRESS:https://myapp.example.com}' "$G/Caddyfile"
          # So are provisioning and deploying: every combination ships both
          # playbooks, with the deploy account, the domain and the model
          # provider substituted in and no placeholder left behind anywhere in
          # the tree that skips Jinja rendering.
          grep -q '^deploy_user: yourname$' "$G/ansible/group_vars/all.yml"
          grep -q '^domain_name: myapp.example.com$' "$G/ansible/group_vars/all.yml"
          grep -q "^LLM_PROVIDER=${{ matrix.llm_provider }}$" "$G/ansible/templates/env-production.j2"
          test -f "$G/ansible/deploy.yml" && test -f "$G/ansible/vault.yml.example"
          ! grep -rqE '__[A-Z_]+__' "$G/ansible"
          grep -q '^LLM_PROVIDER=${{ matrix.llm_provider }}' "$G/.env.example"
          # The answer decides which credentials a project is asked for, so the
          # chosen provider's key is there and the other three are not — in the
          # example env file, in the vault example and in the template the
          # deploy renders on the host, since a key absent from one and present
          # in another is the drift this asserts against. Checked for every
          # provider rather than just the one that regressed: it is the same
          # promise four times. Only vault.yml.example keys its lines as
          # vault_<provider>_api_key; .env.example and env-production.j2 both
          # start the line with the uppercase PROVIDER_API_KEY — the vault
          # variable in env-production.j2 only appears mid-line, inside the
          # Jinja default() expression on the RHS.
          for f in .env.example ansible/vault.yml.example ansible/templates/env-production.j2; do
            case "$f" in
              ansible/vault.yml.example) p='vault_'; ;;
              *) p=''; ;;
            esac
            for provider in ollama openai anthropic openrouter; do
              key="$(echo "$provider" | tr '[:lower:]' '[:upper:]')_API_KEY"
              [ -z "$p" ] || key="vault_${provider}_api_key"
              if [ "$provider" = "${{ matrix.llm_provider }}" ]; then
                grep -q "^$key" "$G/$f" || { echo "$f: missing $key"; exit 1; }
              else
                ! grep -q "^$key" "$G/$f" || { echo "$f: $key ships for ${{ matrix.llm_provider }}"; exit 1; }
              fi
            done
          done
          # No marker comment survives into a generated project, anywhere in
          # it. A marker is a comment (//, #, /* or {/*) opening on cc:begin or
          # cc:end and a name, so prose that mentions the markers, as setup.sh
          # does, is not a match.
          if grep -rnE --exclude-dir=node_modules '(//|#|/\*) *cc:(begin|end) [A-Za-z0-9_-]+' "$G"; then
            echo "cc: markers survived generation" >&2
            exit 1
          fi
          # Consent-gated analytics (issue #85). With none there is no
          # dependency, banner, consent module, loader or proxy, and the
          # /legal/analytics page says nothing is tracked. With PostHog all of
          # it ships, configured at runtime by POSTHOG_KEY.
          if [ "${{ matrix.analytics }}" = none ]; then
            test ! -e "$G/lib/consent.ts" && test ! -e "$G/lib/analytics.ts"
            test ! -e "$G/components/consent" && test ! -e "$G/app/ingest"
            test ! -e "$G/tests/compliance/analytics-consent.test.mjs" && test ! -e "$G/tests/compliance/fake-posthog.mjs"
            if grep -rniE 'posthog' "$G/package.json" "$G/package-lock.json" "$G/app" "$G/components" "$G/lib" "$G/middleware.ts" "$G/.env.example" "$G/next.config.ts"; then
              echo "PostHog survived analytics=none" >&2
              exit 1
            fi
            # `if grep` rather than `! grep`: bash -e does not stop on a
            # negated command, so `! grep` alone would never fail the step.
            if grep -rniE 'ConsentBanner|consent-banner|Privacy choices|globalPrivacyControl|/ingest' "$G/app" "$G/components" "$G/lib" "$G/middleware.ts"; then
              echo "Consent banner or analytics proxy survived analytics=none" >&2
              exit 1
            fi
            test -e "$G/app/(main)/legal/analytics/page.tsx"
            grep -qiE 'nothing is tracked|not tracked|does not track' "$G/app/(main)/legal/analytics/page.tsx"
          else
            test -e "$G/lib/consent.ts" && test -e "$G/lib/analytics.ts"
            test -d "$G/components/consent" && test -e "$G/app/ingest/[...path]/route.ts"
            test -e "$G/tests/compliance/analytics-consent.test.mjs" && test -e "$G/tests/compliance/fake-posthog.mjs"
            test -e "$G/app/(main)/legal/analytics/page.tsx"
            grep -q '"posthog-js":' "$G/package.json" && grep -q '"node_modules/posthog-js":' "$G/package-lock.json"
            grep -q '^POSTHOG_KEY=' "$G/.env.example"
          fi
          # Magic link is independent of the OAuth choice: off drops its files, provider and UI.
          # RESEND_API_KEY stays when the contact form or Stripe still sends email.
          if [ "${{ matrix.include_magic_link }}" = no ]; then
            test ! -e "$G/app/(main)/(auth)/magic-link" && test ! -e "$G/components/auth/magic-link-form.tsx"
            ! grep -rE 'MagicLink|/magic-link|providers/resend' "$G/lib" "$G/app" "$G/components" "$G/middleware.ts"
            # With nothing else sending email, no trace of Resend ships at all.
            if [ "${{ matrix.include_marketing_extras }}" = no ] && [ "${{ matrix.include_stripe }}" = no ]; then
              if grep -rE 'Resend|RESEND' "$G/lib" "$G/app" "$G/components" "$G/middleware.ts" "$G/.env.example"; then
                echo "Resend survived with magic link, marketing extras and Stripe all off" >&2
                exit 1
              fi
            fi
          else
            test -e "$G/components/auth/magic-link-form.tsx"
          fi
          case "${{ matrix.auth_providers }}" in
            google_only) grep -q '^GOOGLE_ID=' "$G/.env.example"; ! grep -q 'MICROSOFT' "$G/.env.example" ;;
            microsoft_only) grep -q 'MICROSOFT' "$G/.env.example"; ! grep -q '^GOOGLE_ID=' "$G/.env.example" ;;
            *) grep -q '^GOOGLE_ID=' "$G/.env.example"; grep -q 'MICROSOFT' "$G/.env.example" ;;
          esac

      # Issue #98. The Caddyfile has no flag-dependent Jinja today, but it is
      # checked under every combination anyway, so one added later cannot
      # break `caddy fmt` for a combination nobody tried. Then it is run
      # against a stub upstream: scanner paths blocked before the app, bodies
      # over their cap refused with 413, event streams unbuffered, and every
      # refusal marked in the JSON access log.
      - name: Caddyfile is formatted, valid and refuses junk at the edge
        run: |
          scripts/check_caddyfile.sh "$G/Caddyfile"
          scripts/check_caddy_edge.sh "$G/Caddyfile"

      - name: Install dependencies (frozen)
        working-directory: .generated/matrix-app
        run: npm ci --no-audit --no-fund

      - name: Install db-writer dependencies (frozen)
        working-directory: .generated/matrix-app/workers/db-writer
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Typecheck
        working-directory: .generated/matrix-app
        run: npm run typecheck

      - name: Lint
        working-directory: .generated/matrix-app
        run: npm run lint

      # The "stripe" npm dependency ships regardless of include_stripe (see
      # hooks/post_gen_project.py::handle_stripe — package.json isn't in the
      # marker-substitution file-extension list), and this test only touches
      # the raw installed package (tests/billing/webhook-signature.test.mjs),
      # never lib/stripe.ts, so it runs unconditionally across every matrix
      # combination, include_stripe=no included.
      - name: Billing webhook signature tests
        working-directory: .generated/matrix-app
        run: npm run test:billing

      - name: Build
        working-directory: .generated/matrix-app
        run: npm run build

      - name: Check poetry.lock and run worker tests
        working-directory: .generated/matrix-app/workers/app
        run: |
          python -m pip install "poetry>=2.5,<3"
          poetry check --lock
          poetry install --no-root
          poetry run pytest -q

      - name: Compile-check Python workers
        working-directory: .generated/matrix-app
        run: python -m compileall -q workers/app

  # Changing python_version invalidates poetry.lock; the hook must drop it
  # instead of shipping a stale one.
  python-version:
    name: Non-default python_version drops poetry.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter
      - run: |
          cookiecutter . --no-input -o .generated-alt project_name="Alt App" python_version=3.13
          test ! -e ".generated-alt/alt-app/workers/app/poetry.lock"
          grep -q 'python = ">=3.13,<4"' .generated-alt/alt-app/workers/app/pyproject.toml

  # Acceptance criterion 1: the proxy config carries the domain answered at
  # generation time. The ACME account address is conditional, so every branch of
  # that condition is generated and handed to Caddy's own parser.
  #
  # scripts/check_caddyfile.sh holds what is true of any Caddyfile; each step
  # adds only what its own answers imply.
  proxy-config:
    name: Caddyfile is generated from the answers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      - name: A deliverable address becomes the ACME account
        run: |
          cookiecutter . --no-input -o .generated-proxy project_name="Proxy App" \
            domain_name=app.proxy-test.dev author_email=ops@proxy-test.dev
          C=.generated-proxy/proxy-app/Caddyfile
          scripts/check_caddyfile.sh "$C"
          grep -qF '{$SITE_ADDRESS:https://app.proxy-test.dev}' "$C"
          grep -q '^[[:space:]]*email ops@proxy-test.dev$' "$C"
          # The flag matrix runs this on files without a global block.
          scripts/check_caddy_edge.sh "$C"

      - name: A reserved example domain leaves the ACME account anonymous
        run: |
          cookiecutter . --no-input -o .generated-proxy-default project_name="Default App"
          C=.generated-proxy-default/default-app/Caddyfile
          scripts/check_caddyfile.sh "$C"
          grep -qF '{$SITE_ADDRESS:https://myapp.example.com}' "$C"
          # No mail reaches you@example.com and a CA may reject it. Omitting the
          # directive entirely still issues certificates, on an anonymous account.
          ! grep -q '^[[:space:]]*email ' "$C"

      - name: A real domain that merely ends in example.com is not treated as reserved
        run: |
          cookiecutter . --no-input -o .generated-proxy-lookalike project_name="Lookalike App" \
            author_email=dev@acme-example.com
          C=.generated-proxy-lookalike/lookalike-app/Caddyfile
          scripts/check_caddyfile.sh "$C"
          grep -q '^[[:space:]]*email dev@acme-example.com$' "$C"

  # Acceptance criteria 2-4: bringing up the production stack is sufficient for
  # working TLS, HTTP redirects to it, and nothing but the proxy is on the
  # host's ports. See scripts/check_tls_stack.sh for why localhost stands in for
  # the real domain.
  tls-stack:
    name: Production stack serves HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      - name: Generate project
        run: cookiecutter . --no-input -o .generated-tls project_name="TLS App"

      # docker-compose.prod.yml runs pre-built images. Only the app image is on
      # the path a request takes, so the worker images are not built here.
      - name: Build the app image
        working-directory: .generated-tls/tls-app
        run: docker build -t tls-app-app:latest --target runner -f Dockerfile .

      - name: Serve HTTPS from the stack
        run: scripts/check_tls_stack.sh .generated-tls/tls-app

  # Acceptance criteria for issue #23 (auth integration tests): an
  # unauthenticated request to a dashboard route redirects to sign-in, public
  # marketing routes remain reachable unauthenticated, a non-admin user is
  # refused the admin area, these tests run in CI against a generated
  # project (this job), and reintroducing prefix-matching on the root path
  # turns them red — verified by hand (see the PR), not by CI, since that
  # would mean shipping the bug to prove the bug is caught.
  #
  # scripts/check_auth.sh does the end-to-end run: it brings up postgres and
  # redis, builds and boots the generated app for real, and runs
  # tests/auth/auth.test.mjs — which ships inside the template itself — as a
  # real HTTP client against it. See that test file for why a real running
  # server is required: this is exactly the class of bug (middleware.ts
  # matching "/" by prefix instead of exactly) that a type checker cannot
  # catch, because the buggy middleware still compiles.
  auth-integration:
    name: The access rules hold against a running app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate project
        # include_marketing_extras=yes: the default, made explicit because
        # tests/auth/auth.test.mjs asserts /blog and /contact are public —
        # routes that flag removes entirely (see flag-matrix's "Assert flag
        # effects" step). Left off the flag, a future default change would
        # silently start asserting on routes that do not exist.
        run: |
          cookiecutter . --no-input -o .generated-auth project_name="Auth App" \
            include_marketing_extras=yes

      - name: The access rules hold against a running app
        run: scripts/check_auth.sh .generated-auth/auth-app

  # Acceptance criteria for issue #78 (compliance foundation): /legal and its
  # subpages render and the footer links to the hub, and no page a visitor
  # can reach — public, auth, legal or the dashboard — makes their browser
  # contact another server before consent. Issue #79 (accessibility
  # baseline) adds to the same suite: the key pages pass axe-core's WCAG 2.2
  # AA rules in both themes, open with a working skip link and show a visible
  # focus outline, and /legal/accessibility shows the configured contact.
  # Issue #80 (age gate) adds tests/compliance/age-gate.test.mjs: no account
  # is created through any provider without a passed age check, and no date
  # of birth is kept. The second run raises legal.minimumAge and reruns it, to
  # prove the line moves with the config rather than being fixed at 13.
  # Issue #81 (renewal terms) adds tests/compliance/renewal-terms.test.mjs:
  # every subscribe button has its plan's auto-renewal terms beside it, and
  # every Stripe Checkout Session repeats them and requires terms-of-service
  # consent, checked against a stand-in Stripe API.
  # Issue #82 (subscription acknowledgment) adds
  # tests/compliance/subscription-acknowledgment.test.mjs: a completed
  # subscription checkout emails the subscriber exactly one acknowledgment
  # with the renewal terms and how to cancel (read from a stand-in Resend
  # API), a failed send fails the event so Stripe's redelivery sends it, a
  # one-time purchase sends none, and an app without Resend still accepts
  # the webhook and sends nothing.
  # Issue #83 (marketing email, CAN-SPAM) adds
  # tests/compliance/unsubscribe.test.mjs: a marketing email's signed link
  # opens a one-button confirmation page, the form and RFC 8058 one-click
  # POSTs each record one suppression, repeats change nothing and tampered
  # links are refused; and tests/compliance/marketing-email.test.mjs:
  # lib/marketing-email.ts refuses to send without a real postal address,
  # skips suppressed recipients, and sends with the footer and both
  # unsubscribe headers (read from a stand-in Resend API).
  # Issue #84 (copyright/DMCA) adds to legal-pages.test.mjs: /legal/copyright
  # shows the configured legal.dmcaAgent and the Terms of Service link to it;
  # the axe audit picks it up with the other /legal pages.
  # Issue #85 (consent-gated analytics) adds
  # tests/compliance/analytics-consent.test.mjs, run against a stand-in
  # PostHog (fake-posthog.mjs) behind the app's first-party /ingest proxy: no
  # analytics request is made before consent or after "Reject", one is made
  # after "Accept", a Global Privacy Control signal suppresses tracking, and
  # withdrawing consent stops it. The consent banner and /legal/analytics
  # join the axe audit, keyboard checks included. Hence the matrix: the
  # default answers (analytics=none, where /legal/analytics says nothing is
  # tracked and no banner exists) and analytics=posthog.
  #
  # Unlike check_auth.sh, the runner ships inside the generated project
  # (scripts/check_compliance.sh, with tests/compliance/*.test.mjs) so that an
  # operator can rerun it after changing their app; this job just runs it
  # against a freshly generated one, with the default answers apart from
  # analytics. It drives the runner's preinstalled Google Chrome through
  # puppeteer-core.
  compliance:
    name: "The legal pages, age gate, renewal terms and acknowledgment, analytics consent, no-third-party-requests rule and WCAG 2.2 AA baseline hold against a running app (analytics=${{ matrix.analytics }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        analytics: [none, posthog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-compliance project_name="Compliance App" \
            analytics=${{ matrix.analytics }}

      - name: The compliance suite passes against a running app
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: .generated-compliance/compliance-app/scripts/check_compliance.sh

      # The age gate does not depend on analytics, so once is enough.
      - name: Raising the minimum age moves the age screen's line
        if: matrix.analytics == 'none'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        working-directory: .generated-compliance/compliance-app
        run: |
          sed -i 's/minimumAge: 13,/minimumAge: 16,/' config.ts
          grep -q 'minimumAge: 16,' config.ts
          scripts/check_compliance.sh tests/compliance/age-gate.test.mjs tests/compliance/legal-pages.test.mjs

  # Acceptance criteria for issue #27 (make the billing flow work end to
  # end): subscription lifecycle webhooks move users between plans correctly,
  # and one-time purchases are recorded and granted — including staying
  # exactly-once granted when Stripe redelivers the same event, which it
  # does on anything but a 2xx response and sometimes even after one. Two
  # bugs this class of test exists to catch: before the fix,
  # customer.subscription.updated wrote the new plan to the `subscriptions`
  # row but never to `users.plan` (the column the rest of the app actually
  # reads), and the one-time-purchase branch logged a message and did
  # nothing. Neither is visible to a type checker or a unit test of the
  # handler's return value — both are database-state bugs, so only asserting
  # on the database after a real HTTP POST against a real running app catches
  # them.
  #
  # scripts/check_billing.sh does the end-to-end run: it brings up postgres,
  # builds and boots a generated app (include_stripe=yes) for real, and runs
  # tests/billing/integration/*.test.mjs — which ship inside the template
  # itself — as a real HTTP client against it, signing fake Stripe events the
  # same way tests/billing/webhook-signature.test.mjs does. See that
  # directory for what is asserted and why.
  billing-integration:
    name: The billing webhooks hold against a running app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cookiecutter

      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-billing project_name="Billing App" \
            include_stripe=yes

      - name: The billing webhooks hold against a running app
        run: scripts/check_billing.sh .generated-billing/billing-app

  # Acceptance criteria for the provisioning playbook: a fresh host reaches a
  # ready state from one command, SSH is key-only with no root login, the
  # firewall exposes only what is needed, unattended upgrades and log rotation
  # are active, and a second run changes nothing.
  #
  # scripts/check_provisioning.sh does the end-to-end run; this job adds what is
  # true of the generated files before anything is run against a host.
  provisioning:
    name: A fresh host reaches a ready state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Not the 3.14 the other jobs use: this Python is the control machine's,
      # not the generated project's, and ansible-core supports a trailing window
      # of interpreter versions rather than the newest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The `ansible` distribution rather than ansible-core: it bundles the
      # community.general and ansible.posix collections the playbook uses, which
      # is what ansible/requirements.yml documents for people who install core.
      - run: python -m pip install cookiecutter ansible ansible-lint

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-provision project_name="Provision App" \
            author_name="Ada Lovelace"

      - name: The deploy account is one name, and both playbooks use it
        working-directory: .generated-provision/provision-app
        run: |
          grep -q '^deploy_user: adalovelace$' ansible/group_vars/all.yml
          # provision.yml creates the account and deploy.yml logs in as it,
          # both through that one variable. A second copy of the name anywhere
          # is the drift this is here to catch — it used to be in a shell
          # script, which is how the two could disagree.
          grep -q 'remote_user: "{{ deploy_user }}"' ansible/deploy.yml
          ! grep -rq adalovelace ansible/deploy.yml ansible/provision.yml

      - name: A name that is not a valid Linux account still produces one
        # useradd takes [a-z_][a-z0-9_-]*, so an apostrophe or a leading digit
        # has to be dropped rather than passed through into a failing playbook.
        run: |
          cookiecutter . --no-input -o .generated-provision-name project_name="Punct App" \
            author_name="9 O'Brien-Smith Jr."
          grep -q "^deploy_user: obrien-smithjr$" .generated-provision-name/punct-app/ansible/group_vars/all.yml

      - name: The playbook parses and lints clean
        working-directory: .generated-provision/provision-app
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/provision.yml --syntax-check
          ansible-lint ansible/

      - name: Provision a throwaway host and check what it left
        run: scripts/check_provisioning.sh .generated-provision/provision-app

  # Acceptance criteria for the deploy playbook: one command deploys, secrets
  # are encrypted at rest and decrypted only into a 0600 file on the host, the
  # DNS pre-flight aborts when the domain does not resolve to the target,
  # migrations run as part of the deploy, and a failed deploy leaves the
  # previous release serving.
  #
  # scripts/check_deploy.sh does all of that end to end against a throwaway
  # host, with a real Postgres and a real proxy; this job adds what is true of
  # the generated files before anything runs. It is the longest job here — it
  # builds all five images, ships ~600MB of them over SSH, and deploys three
  # times (good, unchanged, deliberately broken).
  deploy:
    name: A deploy ships, migrates and can fail safely
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # As in the provisioning job: this Python is the control machine's, and
      # ansible-core supports a trailing window of interpreter versions.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The `ansible` distribution bundles community.docker, which deploy.yml
      # brings the stack up with — see ansible/requirements.yml.
      - run: python -m pip install cookiecutter ansible ansible-lint

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-deploy project_name="Deploy App" \
            author_name="Ada Lovelace"

      - name: The playbook parses and lints clean
        working-directory: .generated-deploy/deploy-app
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check
          ansible-lint ansible/

      - name: The vault is committed and its password is not
        working-directory: .generated-deploy/deploy-app
        run: |
          # The template ships an example to fill in, never a vault: a vault
          # with real values is the operator's, and one with fake values in the
          # template would be a credential nobody rotates.
          test -f ansible/vault.yml.example
          test ! -e ansible/vault.yml
          # Every name in it is prefixed vault_, so a secret is recognisable
          # wherever it is used and a plain group_vars variable cannot shadow
          # one. Anything the example gains has to keep that true.
          ! grep -E '^[a-z][a-z0-9_]*:' ansible/vault.yml.example | grep -qv '^vault_'
          # .gitignore keeps out the password file and never the vault itself.
          grep -q '^\.vault-pass$' .gitignore
          grep -q '^ansible/\.vault-pass$' .gitignore
          ! grep -qE '^ansible/vault\.yml$' .gitignore

      - name: Deploy to a throwaway host and check what deploying means
        run: scripts/check_deploy.sh .generated-deploy/deploy-app

  # Acceptance criteria for the backup playbook: dumps run on a schedule, they
  # are copied to storage that is not the application host, old ones are pruned
  # on the documented policy, and a failure is visible rather than silent.
  #
  # scripts/check_backups.sh does the end-to-end run — it provisions a throwaway
  # host, installs backups on it, and holds each criterion to behaviour rather
  # than to configuration. This job adds what is true of the generated files
  # before anything is run against a host.
  backups:
    name: Backups run, leave the host and are loud when they break
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The control machine's Python, not the generated project's, for the
      # reason the provisioning job gives.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cookiecutter ansible ansible-lint

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-backups project_name="Backup App" \
            author_name="Ada Lovelace"

      - name: The playbook parses and lints clean
        working-directory: .generated-backups/backup-app
        # Before any vault exists, which is the state a fresh checkout is in:
        # --syntax-check does not load vars_files, so this has to pass with no
        # credentials anywhere.
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/backup.yml --syntax-check
          ansible-lint ansible/

      - name: The vault example ships plaintext, and only the password is ignored
        working-directory: .generated-backups/backup-app
        # The contract the README describes: the example is readable, the
        # encrypted vault is committable, and the password that opens it is not.
        # A .gitignore entry for vault.yml itself would quietly stop those
        # credentials from ever being committed, which is the opposite of the
        # intent — hence the negative assertion.
        run: |
          test -f ansible/vault.yml.example
          ! grep -q '^[$]ANSIBLE_VAULT' ansible/vault.yml.example
          grep -q '^vault_backup_remote:' ansible/vault.yml.example
          grep -q '^ansible/[.]vault-pass$' .gitignore
          ! grep -qx 'ansible/vault.yml' .gitignore

      - name: Install backups on a throwaway host and check what they do
        run: scripts/check_backups.sh .generated-backups/backup-app

  # Acceptance criteria for issue #21 (the read-only verbs): the CLI installs
  # from within a generated project, running it with no arguments lists the
  # commands, container status and logs from a remote host are viewable
  # locally, an interactive shell can be opened against any service, and
  # authentication uses the operator's own SSH configuration rather than a
  # key or agent the CLI manages itself.
  #
  # Acceptance criteria for issue #22 (the write verbs): provision and deploy
  # invoke the real playbooks rather than duplicating them, encrypted secrets
  # can be edited without manual tooling, an on-demand backup can be taken,
  # the preflight check catches unresolved DNS, an unreachable host and
  # missing configuration, and restore is documented as not yet available
  # rather than silently absent.
  #
  # scripts/check_cli.sh does the end-to-end run against a throwaway host; this
  # job adds what is true of the generated files, and that the CLI's own
  # TypeScript type-checks and lints clean, before anything is run against a
  # host.
  cli:
    name: opsctl installs and every verb works for real
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The control machine's Python, not the generated project's, for the
      # reason the provisioning job gives.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Matches "node_version" in cookiecutter.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install cookiecutter ansible ansible-lint

      - name: Generate project
        run: |
          cookiecutter . --no-input -o .generated-cli project_name="CLI App" \
            author_name="Ada Lovelace"

      - name: Install dependencies (builds the CLI via the prepare script)
        working-directory: .generated-cli/cli-app
        run: npm ci --no-audit --no-fund

      - name: The CLI's own TypeScript type-checks and lints clean
        working-directory: .generated-cli/cli-app
        run: |
          npm run typecheck
          npm run lint

      - name: The CLI's unit tests pass (arg parsing, inventory parsing, command construction)
        working-directory: .generated-cli/cli-app
        run: npm run test:cli

      - name: opsctl is on the generated project's own npm bin, not named after the slug
        working-directory: .generated-cli/cli-app
        # Acceptance criterion: installable from within a generated project.
        # `npm link` is the mechanism the README documents for a bare `opsctl`
        # on PATH; `npm run cli --` needs neither link nor a global install and
        # is checked throughout this job already. The bin name is fixed
        # (issue #21 asks it not depend on project_slug), so it is identical
        # across every generated project rather than templated.
        run: |
          grep -q '"opsctl": *"cli/dist/index.js"' package.json
          npm link
          command -v opsctl
          opsctl | grep -q 'usage: opsctl'
          npm uninstall -g cli-app >/dev/null

      - name: Run every verb against a throwaway host
        run: scripts/check_cli.sh .generated-cli/cli-app
